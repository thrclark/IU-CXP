<div class="growls">
	@for (alert of growls | async; track alert.id) {
		<espd-alert
			[type]="alert.alertType"
			[header]="alert.header"
			[message]="alert.message"
			[dismissOnTimeout]="alert.autoCloseTimeout ? alert.autoCloseTimeout * 1000 : undefined"
			[buttons]="alert.buttons"
			(alertClosed)="alertClosed(alert)" />
	}
</div>

@for (alert of alerts | async; track alert.id) {
	<espd-alert
		[type]="alert.alertType"
		[header]="alert.header"
		[message]="alert.message"
		[dismissOnTimeout]="alert.autoCloseTimeout ? alert.autoCloseTimeout * 1000 : undefined"
		[buttons]="alert.buttons"
		(alertClosed)="alertClosed(alert)" />
}
