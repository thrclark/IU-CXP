<div class="alert alert-inline alert-{{type()}} justify-content-between" [ngClass]="{'alert-non-standalone': !standalone()}" role="alert">
	<div class="flex-shrink-0 d-flex align-items-center">
		<i [espdIcon]="icons[type()]"></i>
		<p><espd-message [config]="message()" /></p>
	</div>
	@if (button()){
		<espd-button [config]="button()" />
	}
</div>
