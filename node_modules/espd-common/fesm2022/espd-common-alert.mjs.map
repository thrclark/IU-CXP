@if (!isClosed) {
	<div
		[@openClose]="isOpen ? 'open' : 'closed'"
		class="alert alert-{{type}} text-break"
		role="alertdialog"
		tabindex="-1"
		[attr.aria-labelledby]="'information-alert-title' + id">
		@if (header) {
			<div class="alert-heading" id="information-alert-title{{id}}" [class.pr-4]="dismissible">
				<espd-message [config]="header" />
			</div>
		}
		@if (isMessageString) {
			<p [innerHTML]="message" [class.pr-4]="dismissible && !header"></p>
		} @else {
			<espd-message [config]="message" />
		}
		<ng-content />
		@if (buttons?.length) {
			<div class="button-group button-group-right mt-0">
				@for (button of buttons; track $index) {
					<espd-button [config]="button" (click)="clicked(button)" />
				}
			</div>
		}
		@if (dismissible) {
			<button class="close" (click)="close()" type="button">
				<espd-message key="common.close" class="sr-only" />
				<i espdIcon="rvt-close"></i>
			</button>
		}
	</div>
}
