@if (active()) {
<ng-container *ngTemplateOutlet="content" />
} @else {
	@if (!link() && !href()) {
	<espd-button color="link">
		<ng-container *ngTemplateOutlet="content" />
	</espd-button>
	} @else if (href()) {
	<a [href]="href()">
		<ng-container *ngTemplateOutlet="content" />
	</a>
	} @else {
	<a [routerLink]="route()" [queryParams]="queryParams()">
		<ng-container *ngTemplateOutlet="content" />
	</a>
	}
}

<ng-template #content>
	<ng-content />
</ng-template>
