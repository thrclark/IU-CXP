<ng-template #content>
	<div class="swatchcolor-left" [ngStyle]="styles.leftStyle">
		@if (colors.length > 0) {
			<espd-message key="common.button.color" [args]="[colors[0]]" class="sr-only" />
		}
	</div>
	<div class="swatchcolor-right" [ngStyle]="styles.rightStyle">
		@if (colors.length === 1) {
			<espd-message key="common.button.color" [args]="[colors[0]]" class="sr-only" />
		}
		@if (colors.length > 1) {
			<espd-message key="common.button.color" [args]="[colors[1]]" class="sr-only" />
		}
	</div>
	<span class="sr-only">@if (config?.text) {
		<espd-message [config]="config!.text" />
	}</span>
	<ng-content />
</ng-template>

@if (routerPath !== undefined) {
	<a [class]="classes"
		[routerLink]="routerPath"
		[queryParams]="queryParams">
		<ng-container [ngTemplateOutlet]="content" />
	</a>
} @else if (path !== undefined) {
	<a [class]="classes" [href]="path">
		<ng-container [ngTemplateOutlet]="content" />
	</a>
} @else  {
	<button [class]="classes"
			[class.disable-hover-decoration]="disableHoverTextDecoration"
			[class.loading]="loading"
			[type]="type"
			[disabled]="disabled || loading">
		@if (loading) {
			<span class="spinner-border spinner--xs" role="status" aria-busy="true">
				<espd-message key="common.loading" class="sr-only" />
			</span>
		}
		<span [class.invisible]="loading" class="d-flex">
			<ng-container [ngTemplateOutlet]="content" />
		</span>
	</button>
}
