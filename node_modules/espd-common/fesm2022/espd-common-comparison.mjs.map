@if (show()) {
<dt class="col-md-4" [class.new]="isChanged()">
	<espd-message [config]="label()" />&nbsp;
	@if (isChanged()) {
	<espd-message key="common.change.current" class="ts-12 font-italic font-weight-normal" />
	}
</dt>
<dd class="col-md-8 text-break" [class.new]="isChanged()">
	<ng-container *ngTemplateOutlet="valueTemplate(); context: {$implicit : currentValue()}" />
</dd>

@if (isChanged()) {
	<dt class="old col-md-4">
		<espd-message [config]="label()" />&nbsp;
		<espd-message key="common.change.previous" class="ts-12 font-italic font-weight-normal" />
	</dt>
	<dd class="old col-md-8 text-break">
		<ng-container *ngTemplateOutlet="valueTemplate(); context: {$implicit : oldValue()}" />
	</dd>
}
}

<ng-template #defaultTemplate let-value>{{valueOrDash(value)()}}</ng-template>
