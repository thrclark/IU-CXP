<ng-template #content>
  <ng-content />
</ng-template>

@if (routerPath() !== undefined) {
<a [routerLink]="routerPath()"
		[queryParams]="queryParams()"
		[class.active]="active()"
		[class.disabled]="disabled()"
		class="dropdown-item">
	<ng-container *ngTemplateOutlet="content" />
</a>
} @else if (href() !== undefined) {
<a [href]="href()"
		[class.active]="active()"
		[class.disabled]="disabled()"
		[attr.target]="target() ? '_'+target() : null"
		class="dropdown-item">
	<ng-container [ngTemplateOutlet]="content" />
</a>
} @else {
<button type="button"
		[class.active]="active()"
		[disabled]="disabled()"
		(click)="onClick()"
		class="dropdown-item">
	<ng-container [ngTemplateOutlet]="content" />
</button>
}
