<div dropdown class="dropdown" [placement]="placement()">
	<espd-button dropdownToggle
			[color]="color()" [rounded]="rounded()"
			[secondary]="secondary()" [small]="small()"
			[disabled]="disabled()" id="espd-dropdown-{{id()}}">
		<div [class.dropdown-toggle]="showChevron()" class="toggle-label">
			<ng-content select="espd-dropdown-label" />
		</div>
	</espd-button>
	<div *dropdownMenu class="dropdown-menu"
			[class.dropdown-menu-right]="placement() === 'right'"
			[attr.aria-labelledby]="'espd-dropdown-'+id()" role="menu">
		<ng-content />
	</div>
</div>
