<div [formGroup]="formGroup" class="d-flex justify-content-between" [class.align-items-start]="isSmall" [class.align-items-md-center]="!isSmall">
	<div class="row flex-grow-1" #criteriaContainer>
		<div [class.col-12]="isSmall" [class.col-5]="!isSmall" [class.expand]="formGroup.controls.key.value !== null">
			<espd-message key="common.acl.field.mappings.name" class="sr-only" id="mapping-name" />
			<select formControlName="key"
					class="form-control"
					aria-labelledby="mapping-name">
				<option [ngValue]="null"><espd-message key="common.select.blank" /></option>
				@for (m of attributeMappings; track m.key) {
					<option [ngValue]="m.key">{{m.value}}</option>
				}
			</select>
		</div>
		@if (formGroup.controls.key.value !== null) {
			<div [class.col-12]="isSmall" [class.col-3]="!isSmall">
				<espd-message key="common.acl.field.comparison.name" class="sr-only" id="compare-name" />
				<select class="form-control"
						formControlName="negated"
						aria-labelledby="compare-name">
					@for (v of [{key: false, value: messageService.get('common.acl.comparison.equal')}, {key: true, value: messageService.get('common.acl.comparison.notEqual')}]; track v.key) {
						<option
							[ngValue]="v.key">
							{{v.value}}
						</option>
					}
				</select>
			</div>
		}
		@if (formGroup.controls.key.value !== null) {
			<div [class.col-12]="isSmall" [class.col-4]="!isSmall">
				<espd-message key="common.acl.field.value.name" class="sr-only" id="name" />
				<input class="form-control"
					type="text"
					formControlName="value"
					aria-labelledby="name">
				</div>
			}
		</div>
		@if (!isSingleItem) {
			<espd-button color="close" (click)="removeSelf()" [class.mt-1]="isSmall">
				<espd-message key="common.remove" class="sr-only" />
			</espd-button>
		}
	</div>
