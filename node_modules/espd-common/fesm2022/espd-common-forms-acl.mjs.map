<dl [formGroup]="expressionForm">
	<dt class="d-flex justify-content-between align-items-end">
		<div class="button-group-segmented">
			<espd-button [secondary]="expressionForm.controls.type.value === Expressions.AndExpression._class"
				[disabled]="numControls < 2" [small]="true"
				(click)="setType(Expressions.OrExpression._class)">
				<espd-message key="common.acl.group.or" />
			</espd-button>
			<espd-button [secondary]="expressionForm.controls.type.value === Expressions.OrExpression._class"
				[disabled]="numControls < 2" [small]="true"
				(click)="setType(Expressions.AndExpression._class)">
				<espd-message key="common.acl.group.and" />
			</espd-button>
		</div>
		<div class="action-container">
			<div dropdown class="dropdown d-inline-block">
				<espd-button dropdownToggle [secondary]="true" [small]="true">
					<espd-message key="common.acl.buttons.add" class="dropdown-toggle" />
				</espd-button>
				<div *dropdownMenu class="dropdown-menu dropdown-menu-right" role="menu">
					<button type="button"
						class="dropdown-item"
						(click)="addCriteria()">
						<espd-message key="common.acl.action.addCriteria" />
					</button>
					<button type="button"
						class="dropdown-item"
						(click)="addGroup()">
						<espd-message key="common.acl.action.addGroup" />
					</button>
				</div>
			</div>
			@if (!isTopLevel) {
				<espd-button color="close"
					class="ml-1"
					(click)="removeSelf()">
					<espd-message key="common.remove" class="sr-only" />
				</espd-button>
			}
		</div>
	</dt>
	<dd>
		<ul>
			@for (leafChild of leafChildren.controls; track leafChild; let i = $index) {
				<li formArrayName="leafChildren">
					<div [formGroupName]="i">
						<espd-expression-criteria
							[isSingleItem]="leafChildren.controls.length === 1"
							(remove)="removeCriteria($event)" />
						</div>
					</li>
				}
				@for (node of nonLeafChildren.controls; track node; let i = $index) {
					<div formArrayName="nonLeafChildren">
						<div [formGroupName]="i">
							<espd-non-leaf-expression
								[expressionForm]="$any(node)"
								[isTopLevel]="false"
								(remove)="removeExpressionGroup($event)" />
							</div>
						</div>
					}
				</ul>
			</dd>
		</dl>
