<div class="d-flex align-items-end">
	@if (label || directions) {
		<espd-control-label class="mb-1"
			[label]="label" labelId="espd-input-{{id}}"
			[directions]="directions" directionsId="espd-input-{{id}}-directions"
			[required]="required"
			class="flex-grow-1" />
	}
	@if (mode === 'html') {
		<espd-button (click)="showMarkupDialog()" color="link" [small]="true" class="ml-3">
			<espd-message key="common.code.supportedTags" class="font-italic ts-12" />
		</espd-button>
	}
</div>

<div class="row flex-grow-1">
	<div class="col-{{width}}">
		<div class="input-group h-100">
			<espd-ace-reactive class="flex-grow-1 form-control" [mode]="mode"
				[formControl]="control"
				labelledBy="espd-input-{{id}} espd-input-{{id}}-directions" />
				@if (buttonConfig) {
					<div class="input-group-append d-none d-lg-flex">
						<span class="input-group-text p-0">
							<button type="button" (click)="buttonConfig.action()" class="btn btn-sm btn-outline-primary h-100">
								<i [espdIcon]="buttonConfig.icon || 'rvt-sync'"></i>
								<espd-message [config]="buttonConfig.srMessage" class="sr-only" />
							</button>
						</span>
					</div>
				}
			</div>
			@if (control && !hideErrorMessages) {
				<espd-errors [control]="control" [messages]="errorMessages" />
			}
		</div>
	</div>

	<ng-template #tagsModalTemplate>
		<p><espd-message key="common.code.supportedTags.body" /></p>
		<ul class="list-unstyled columns">
			@for (tag of supportedTags; track $index) {
				<li class="mt-0"><code>&lt;{{tag}}&gt;</code></li>
			}
		</ul>
	</ng-template>
