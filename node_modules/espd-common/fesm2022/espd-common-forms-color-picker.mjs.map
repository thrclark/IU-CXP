<espd-input-scaffold>
	@if (control !== null) {
		<div class="input-group">
			<input type="color"
				[formControl]="control"
				[attr.aria-labelledby]="ariaLabelledby"
				class="form-control d-inline">
			<div class="input-group-append flex-grow-1">
				<input type="text"
					[formControl]="control"
					[placeholder]="placeholder"
					class="form-control d-inline w-100"
					[attr.aria-labelledby]="ariaLabelledby">
			</div>
		</div>
	}
</espd-input-scaffold>
