<ng-template #contentTemplate>
	@if (label) {
		<span class="label" [attr.id]="labelId || null" [class.mb-2]="!!directions" [class.mb-0]="!directions">
			<espd-message [config]="label" />
			@if (required) {
				<espd-message key="common.label.required" class="ts-12 font-italic font-weight-normal ml-1" />
			}
		</span>
	}
</ng-template>


@if (noLabelTagOrDirections) {
	<ng-container *ngTemplateOutlet="contentTemplate" />
} @else {
	<label>
		<ng-container *ngTemplateOutlet="contentTemplate" />
	</label>
	@if (directions) {
		<espd-message [config]="directions" [attr.id]="directionsId || null" class="d-block" />
	}
}
