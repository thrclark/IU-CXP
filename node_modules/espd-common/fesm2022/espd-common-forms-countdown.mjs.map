<ng-content />
@if (maxLength && control && control.value !== null) {
	<span aria-hidden="true" class="badge"
		[class.badge-success]="control!.value.length <= maxLength!"
		[class.badge-danger]="control!.value.length > maxLength!">
		{{maxLength! - control!.value.length}}
	</span>
	<span class="sr-only">
		@if (control!.value.length < maxLength) {
			<espd-message key="common.countdown.limit.left" [args]="[(maxLength! - control!.value!.length) + '']" />
		} @else if (control!.value.length === maxLength) {
			<espd-message key="common.countdown.limit.reached" role="alert" />
		} @else {
			<espd-message key="common.countdown.limit.passed" [args]="[(control!.value.length - maxLength!) + '']" />
		}
	</span>
}
