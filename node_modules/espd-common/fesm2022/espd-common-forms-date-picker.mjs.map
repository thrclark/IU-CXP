<espd-input-scaffold>
	<espd-ngx-timepicker
		[attr.aria-labelledby]="ariaLabelledby"
		[formControl]="control"
		[hourStep]="$any(timePickerConfig.hourStep)"
		[minuteStep]="$any(timePickerConfig.minuteStep)"
		[secondsStep]="$any(timePickerConfig.secondsStep)"
		[readonlyInput]="$any(timePickerConfig.readonlyInput)"
		[mousewheel]="$any(timePickerConfig.mousewheel)"
		[arrowkeys]="$any(timePickerConfig.arrowkeys)"
		[showSpinners]="$any(timePickerConfig.showSpinners)"
		[showMeridian]="$any(timePickerConfig.showMeridian)"
		[showMinutes]="$any(timePickerConfig.showMinutes)"
		[showSeconds]="$any(timePickerConfig.showSeconds)"
		[meridians]="$any(timePickerConfig.meridians)"
		[hoursPlaceholder]="$any(timePickerConfig.hoursPlaceholder)"
		[minutesPlaceholder]="$any(timePickerConfig.minutesPlaceholder)"
		[secondsPlaceholder]="$any(timePickerConfig.secondsPlaceholder)"
		[min]="timePickerConfig.min"
		[max]="timePickerConfig.max" />
</espd-input-scaffold>
