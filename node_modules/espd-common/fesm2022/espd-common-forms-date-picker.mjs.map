<espd-input-scaffold>
	<div class="row align-items-center" [formGroup]="form">
		<div class="col-auto">
			<espd-date-picker
				#datePicker
				espdControlName="date"
				[config]="datePickerConfig"
				[placeholder]="placeholder"
				[labelledby]="ariaLabelledby" />
		</div>
		<div class="col-auto align">
			<espd-time-picker
				espdControlName="time"
				[config]="timePickerConfig"
				[labelledby]="ariaLabelledby" />
			<espd-button (click)="clear()" color="link" class="pl-3" [disabled]="form.disabled">
				<espd-message key="common.clear" class="ts-12 font-italic" />
			</espd-button>
		</div>
	</div>
</espd-input-scaffold>
