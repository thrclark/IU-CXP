<espd-input-scaffold>
	<input type="text"
		[attr.aria-labelledby]="ariaLabelledby"
		autocomplete="off"
		bsDatepicker
		[bsConfig]="datePickerConfig"
		class="form-control"
		[formControl]="control"
		[placeholder]="placeholder"
		[isDisabled]="control.disabled || disabled">
</espd-input-scaffold>
