<div [formGroup]="control" class="form-group">
	<espd-select espdControlName="fontFamily"
			[size]="size"
			[label]="{key: 'common.font.field.fontFamily'}"
			[directions]="{key: 'common.font.field.fontFamily.directions'}"
			[options]="fontFamilyOptionsWithCustom" />
	@if (fontFamilyControlValue === null) {
		<espd-input espdControlName="fontFaceName"
			[size]="size"
			[label]="{key: 'common.font.field.name'}"
			[directions]="{key: 'common.font.field.name.directions'}"
			[required]="true"
			[maxLength]="100" />
		<espd-select espdControlName="fallback"
			[size]="size"
			[label]="{key: 'common.font.field.fontFamilyFallback'}"
			[directions]="{key: 'common.font.field.fontFamilyFallback.directions'}"
			[options]="fontFamilyOptions" />
	}
	@if (control && !hideErrorMessages) {
		<espd-errors [control]="control" [messages]="errorMessages" />
	}
</div>
