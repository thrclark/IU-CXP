<espd-input-scaffold>
	<div class="dropdown">
		<espd-button [secondary]="true"
			[popover]="popoverTemplate"
			[outsideClick]="true"
			placement="bottom"
			#pop="bs-popover"
			(onShown)="popoverOpened()">
			<span class="dropdown-toggle">
				@if (control.value) {
					<i [espdIcon]="control.value" class="mr-1"></i>
				}
				@if (!control.value) {
					<espd-message key="common.itemPicker.select" />
				}
			</span>
		</espd-button>
	</div>
	<div class="font-italic ts-12">{{control.value}}</div>
</espd-input-scaffold>

<ng-template #popoverTemplate>
	@if (page) {
		<div class="template-body">
			<div class="row nav">
				<div class="col">
					<button type="button" class="btn btn-link" [class.disabled]="!page.hasPrevious" (click)="previousPage()">
						<i espdIcon="rvt-chevron-left" aria-hidden="true"></i>
						<espd-message key="common.pagination.previous.sr" class="sr-only" />
					</button>
				</div>
				<span class="col-6 text-center">{{page.number}} / {{page.totalPages}}</span>
				<div class="col text-right">
					<button type="button" class="btn btn-link" [class.disabled]="!page.hasNext" (click)="nextPage()">
						<i espdIcon="rvt-chevron-right" aria-hidden="true"></i>
						<espd-message key="common.pagination.next.sr" class="sr-only" />
					</button>
				</div>
			</div>
			<div [formGroup]="form">
				<espd-search espdControlName="search" [placeholder]="{key:'common.search'}" searchButtonIcon="" searchButtonText="" />
			</div>
			<div class="d-flex flex-wrap item-list"
					(keydown.arrowup)="move('up', $event)"
					(keydown.arrowleft)="move('left', $event)"
					(keydown.arrowdown)="move('down', $event)"
					(keydown.arrowright)="move('right', $event)">
				@for (icon of page.content; track icon) {
					<button
						#iconButton
						type="button"
						class="btn btn-outline-primary btn-icon"
						[class.selected]="isSelected(icon)"
						[attr.aria-current]="isSelected(icon).toString()"
						[title]="icon"
						(click)="select(icon)">
						<i [espdIcon]="icon"></i>
					</button>
				}
			</div>
		</div>
	}
</ng-template>
