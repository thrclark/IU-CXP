<ng-template #input>
	<ng-content />
</ng-template>

<ng-template #content>
	<div class="row">
		<div class="col-{{width}}">
			@if (!!maxLength) {
				<espd-countdown [control]="control" [maxLength]="maxLength">
					<ng-container *ngTemplateOutlet="input" />
				</espd-countdown>
			} @else {
				<ng-container *ngTemplateOutlet="input" />
			}
			@if (control && !hideErrorMessages) {
				<espd-errors [control]="control" [messages]="errorMessages" />
			}
		</div>
	</div>
</ng-template>

<ng-template #controlLabel>
	@if (label || directions) {
		<espd-control-label
			class="mb-1" [class.sr-only]="labelSrOnly"
			[label]="label" labelId="espd-input-{{id}}"
			[directions]="directions" directionsId="espd-input-{{id}}-directions"
			[required]="required" [noLabelTagOrDirections]="fieldSet" />
	}
</ng-template>


<div class="form-group">
	@if (fieldSet) {
		<fieldset>
			<legend>
				<ng-container *ngTemplateOutlet="controlLabel" />
			</legend>
			@if (directions) {
				<espd-message [config]="directions" attr.id="espd-input-{{id}}-directions" class="d-block" />
			}
			<ng-container *ngTemplateOutlet="content" />
		</fieldset>
	} @else {
		<ng-container *ngTemplateOutlet="controlLabel" />
		<ng-container *ngTemplateOutlet="content" />
	}
</div>
