<div class="card">
	<div class="card-body">
		@if (!hideInput) {
			<div class="d-flex">
				<div class="flex-grow-1 mr-3" [formGroup]="form">
					@if (selectOptions) {
						<espd-select #input
							(keydown.enter)="addItem($event)"
							[labelledby]="inputAriaLabelledBy"
							[options]="selectOptions"
							[required]="required"
							espdControlName="listItem" />
					} @else if (datePickerConfig) {
						<espd-date-picker #input
							(keydown.enter)="addItem($event)"
							espdControlName="listItem" />
					} @else {
						<espd-input #input
							(keydown.enter)="addItem($event)"
							[labelledby]="inputAriaLabelledBy"
							[maxLength]="maxLength"
							[required]="required"
							espdControlName="listItem"/>
					}
				</div>
				<espd-button (click)="addItem()">
					@if (inputButtonIcon) {
						<i [espdIcon]="inputButtonIcon"></i>
					}
					<espd-message [class.sr-only]="!!inputButtonIcon" [config]="inputButtonText" />
				</espd-button>
			</div>
		}
		<div [class.mt-3]="contentMargin" [style.max-height]="maxHeight ? maxHeight + 'px' : null">
			<ng-content />
		</div>
	</div>
</div>
