<espd-input-scaffold [hideErrorMessages]="true">
	<espd-list-builder
			[inputButtonText]="{key: 'common.search'}"
			inputButtonIcon="magnifying-glass"
			[hideInput]="!!control.value"
			[contentMargin]="hasItems && !control.value"
			[maxHeight]="maxHeight"
			[inputPlaceholder]="placeholder"
			(submitInput)="search($any($event))">
		@if (hasItems && !control.value) {
			<table class="table">
				<caption class="sr-only">
					<espd-message key="common.itemPicker.searchResults" />
				</caption>
				<tbody>
					@for (item of items; track item; let index = $index) {
						<tr [class.bg-gray]="dimRow(item, index)">
							<td>
								<ng-container *ngTemplateOutlet="itemTemplate; context: {rowItem : item}" />
							</td>
							<td class="text-right">
								<espd-button [secondary]="true" [small]="true" (click)="select(item)">
									<espd-message key="common.itemPicker.select" />
								</espd-button>
							</td>
						</tr>
					}
				</tbody>
			</table>
		}
		@if (!!control.value) {
			<div class="d-flex justify-content-between align-items-center">
				<div>
					<ng-container *ngTemplateOutlet="itemTemplate; context: {rowItem : control.value}" />
				</div>
				<espd-button [secondary]="true" (click)="change()">
					<espd-message key="common.itemPicker.change" />
				</espd-button>
			</div>
		}
	</espd-list-builder>
</espd-input-scaffold>
