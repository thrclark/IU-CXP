<espd-input-scaffold>
	<div class="input-group clear-field" [class.no-button]="!searchButtonIcon && !searchButtonText">
		@if (datePickerConfig) {
			<input #input
				type="text"
				[formControl]="control"
				class="form-control flex-grow-1"
				[class.border-right-0]="control.value"
				id="search-{{id}}"
				[attr.aria-labelledby]="ariaLabelledby"
				[attr.readonly]="disabled ? true : null"
				[placeholder]="placeholder"
				(keydown.enter)="doSearch($event)"
				bsDatepicker
				[bsConfig]="datePickerConfiguration">
		} @else {
			<input #input
				type="text"
				[formControl]="control"
				class="form-control flex-grow-1"
				[class.border-right-0]="control.value"
				id="search-{{id}}"
				[attr.aria-labelledby]="ariaLabelledby"
				[attr.aria-label]="ariaLabelledby ? null : placeholder"
				[attr.readonly]="disabled ? true : null"
				[placeholder]="placeholder"
				(keydown.enter)="doSearch($event)">
		}
		@if (control.value) {
			<button type="button" class="btn cleartext btn-outline-primary"
					(click)="clearSearchButtonAction($event)"
					[disabled]="disabled">
				<i espdIcon="rvt-close-circle"></i>
				<espd-message class="sr-only" key="common.clearSearchText" />
			</button>
		}
		@if (searchButtonIcon || searchButtonText) {
			<div class="input-group-append">
				<button type="button" class="btn btn-primary" (click)="doSearch()" [disabled]="disabled">
					@if (searchButtonIcon) {
						<i [espdIcon]="searchButtonIcon"></i>
					}
					<espd-message [class.sr-only]="!!searchButtonIcon" [config]="searchButtonText" />
				</button>
			</div>
		}
	</div>
</espd-input-scaffold>
