<label for="espd-switch-{{id}}">
	<espd-control-label class="sr-only" [label]="label" [required]="required" [noLabelTagOrDirections]="true" />
	<input type="checkbox" [formControl]="control" id="espd-switch-{{id}}">
	<espd-message key="common.switch.on" [style.visibility]="checked() ? 'visible' : 'hidden'" />
	<espd-message key="common.switch.off" [style.visibility]="checked() ? 'hidden' : 'visible'" />
</label>
