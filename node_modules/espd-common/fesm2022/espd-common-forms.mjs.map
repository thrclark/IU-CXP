<espd-input-scaffold>
	<select
		[formControl]="control"
		[attr.aria-labelledby]="ariaLabelledby"
		[attr.disabled]="disabled ? true : null"
		class="form-control">
		@for (option of options; track option[0]) {
			<option [ngValue]="option[0]">
				<espd-message [config]="option[1]" />
			</option>
		}
	</select>
	<ng-content /> <!-- needed to project the optional details template -->
	@if (this.detailsTemplate && this.control.value !== null && this.control.value !== undefined) {
		<div class="rounded-bottom p-3 mt-1">
			<ng-container [ngTemplateOutlet]="detailsTemplate" [ngTemplateOutletContext]="{$implicit: control.value}" />
		</div>
	}
</espd-input-scaffold>
