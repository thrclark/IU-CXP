<espd-input-scaffold [maxLength]="maxLength">
	<input #input
		[type]="type"
		[formControl]="control"
		[attr.aria-labelledby]="ariaLabelledby"
		[maxlength]="$any(maxLength)"
		[attr.readonly]="disabled ? true : null"
		[placeholder]="placeholder"
		[inputMode]="inputMode"
		[min]="min"
		[max]="max"
		[step]="step"
		[mask]="mask"
		class="form-control">
</espd-input-scaffold>
