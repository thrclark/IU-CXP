<espd-input-scaffold [fieldSet]="(options?.length || 0) > 1">
	@for (option of options; track $index; let i = $index) {
		<div class="form-check">
			<input type="checkbox"
					[formControl]="option.control"
					id="espd-checkbox-{{id}}-{{i}}"
					class="form-check-input">
			<label class="form-check-label" for="espd-checkbox-{{id}}-{{i}}">
				@if (isLabelMessage(option.label)) {
					<espd-message [config]="option.label" />
				}
				@if (isLabelTemplate(option.label)) {
					<ng-container *ngTemplateOutlet="option.label; context: {option, index: i}" />
				}
			</label>
		</div>
	}
</espd-input-scaffold>
