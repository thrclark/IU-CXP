<espd-input-scaffold [fieldSet]="true">
	@for (option of options; track $index; let i = $index) {
		<div class="form-check">
			<input type="radio"
				[formControl]="control"
				[value]="option.value"
				[attr.disabled]="option.disabled ? true : null"
				id="espd-radio-{{id}}-{{i}}"
				name="espd-radio-{{id}}"
				attr.name="espd-radio-{{id}}"
				class="form-check-input">
			<label class="form-check-label" for="espd-radio-{{id}}-{{i}}">
				<espd-message [config]="option.label" />
			</label>
		</div>
	}
</espd-input-scaffold>
