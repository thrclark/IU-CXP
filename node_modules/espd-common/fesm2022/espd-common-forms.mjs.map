<espd-input-scaffold>
	<div class="d-flex align-items-center border rounded p-1 pr-3">
        <input [formControl]="control" 
               type="text" 
               [attr.aria-labelledby]="ariaLabelledby"
               [placeholder]="placeholder"
               class="ts-20 flex-shrink-1 text-right">
        <div class="mr-3">{{valueSuffix}}</div>
        <input [formControl]="control" 
                type="range" 
                [min]="min" 
                [max]="max" 
                [step]="step" 
                [attr.aria-labelledby]="ariaLabelledby"
                class="form-control-range w-100">
	</div>
</espd-input-scaffold>
