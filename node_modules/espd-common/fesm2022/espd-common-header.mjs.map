@if (route) {
	<a [routerLink]="route"
			[queryParams]="queryParams"
			routerLinkActive
			[routerLinkActiveOptions]="isActiveMatchOptions"
			#rla="routerLinkActive"
			ariaCurrentWhenActive="page">
		<ng-container *ngTemplateOutlet="content" />
	</a>
} @else {
	@if (href) {
		<a [href]="href">
			<ng-container *ngTemplateOutlet="content" />
		</a>
	} @else {
		<button type="button" class="font-weight-normal">
			<ng-container *ngTemplateOutlet="content" />
		</button>
	}
}

<ng-template #content>
	<ng-content />
</ng-template>
