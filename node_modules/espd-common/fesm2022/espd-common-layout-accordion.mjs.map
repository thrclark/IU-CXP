@if (isActionList) {
	<espd-dropdown [secondary]="true" [showChevron]="false" color="link" placement="right">
		<espd-dropdown-label>
			<i espdIcon="rvt-ellipsis"></i>
			<espd-message [config]="actionList.label" class="sr-only" />
		</espd-dropdown-label>
		@for (action of actionList.actions; track $index) {
			@if (!isSeparator(action)) {
				<espd-dropdown-item
						[routerPath]="action.route"
						[disabled]="action.disabled || false"
						(click)="action.action?.()">
					<espd-message [config]="action.label" />
				</espd-dropdown-item>
			} @else {
				<div class="dropdown-divider"></div>
			}
		}
	</espd-dropdown>
}

@if (isSingleAction) {
	<espd-button
			color="link"
			[secondary]="true"
			[routerPath]="singleAction.route"
			(click)="singleAction.performAction()">
		@if (singleAction.hideLabel) {
			<i [espdIcon]="singleAction.icon ? singleAction.icon : 'rvt-arrow-right'"></i>
		}
		<espd-message [config]="singleAction.label" [class.sr-only]="singleAction.hideLabel" />
	</espd-button>
}
