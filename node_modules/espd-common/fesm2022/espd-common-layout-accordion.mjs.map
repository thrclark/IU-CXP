<div class="heading">
	<espd-message id="accordion_label_{{id}}" [config]="heading" />
	<div>
		<ng-content select="[accordion-disclosure]" />
		<espd-section-actions [actions]="actions" class="mx-1" />
		<button (click)="toggleOpen()" class="btn" type="button"
				[attr.aria-labelledby]="'accordion_label_' + id"
				[attr.aria-expanded]="isOpen"
				[attr.aria-controls]="'accordion_region_' + id">
			<i [espdIcon]="isOpen ? 'rvt-minus' : 'rvt-plus'" class="ts-16"></i>
			<espd-message class="sr-only" [key]="'common.accordion.sr.' + (isOpen ? 'collapse' : 'expand')" />
		</button>
	</div>
</div>
<div role="region"
		id="accordion_region_{{id}}"
		[attr.aria-labelledby]="'accordion_label_' + id"
		[collapse]="!isOpen"
		[isAnimated]="isAnimated">
	<div>
		<ng-content />
	</div>
</div>
