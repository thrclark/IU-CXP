<ng-template #adminHeadingTemplate>
	<espd-admin-header [headerText]="heading">
		<espd-breadcrumb-list>
			@for (breadcrumbConfig of breadcrumbConfigs; track $index; let isLast = $last) {
				<espd-breadcrumb [link]="breadcrumbConfig.link || ''" [active]="isLast || !breadcrumbConfig.link">
					<espd-message [config]="breadcrumbConfig.message" />
				</espd-breadcrumb>
			}
		</espd-breadcrumb-list>
	</espd-admin-header>
</ng-template>

<div class="row">
	<form [formGroup]="form" (ngSubmit)="onSave()" class="col-12 col-lg-8">

		<ng-content />

		<hr class="my-5">
		<div class="button-group mt-3">
			@if (!buttons) {
				<espd-button [loading]="pendingSave" type="submit">
					<espd-message key="common.save" />
				</espd-button>
				<espd-button [secondary]="true" (click)="goBack()">
					<espd-message key="common.cancel" />
				</espd-button>
			} @else {
				@for (button of buttons; track $index) {
					<espd-button [config]="button" />
				}
			}
		</div>
	</form>
</div>
