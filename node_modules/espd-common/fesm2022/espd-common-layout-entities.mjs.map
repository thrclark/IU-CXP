@if (displayForm) {
	<div class="card border-0 shadow-sm">
		<div class="card-body">
			<div class="d-flex justify-content-between align-items-center">
				<espd-message key="common.list.filters" class="ts-23 font-weight-light mb-3" />
				<espd-button [secondary]="true" [rounded]="true" (click)="displayForm = false">
					<i espdIcon="rvt-close"></i>
					<espd-message key="common.close" class="sr-only" />
				</espd-button>
			</div>
			<ng-content select="[form]" />
		</div>
	</div>
} @else {
	<div class="form-row align-items-center my-3">
		<div class="col-12 col-sm-auto ts-12">
			<button type="button" (click)="displayForm = true" class="btn btn-link ts-14 font-italic">
				<espd-message key="common.list.filters" />
			</button>
		</div>
		<div class="col">
			<ng-content select="[values]" />
		</div>
	</div>
}
