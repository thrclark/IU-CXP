<ng-template #entityHeadingTemplate>
	<ng-content select="espd-admin-header" />
	@if (heading()) {
		<espd-admin-header [headerText]="heading()!">
			@if (breadcrumbs()) {
				<espd-breadcrumb-list>
					@for (breadcrumb of breadcrumbs(); track $index; let isLast = $last) {
						<espd-breadcrumb [link]="breadcrumb.link || ''" [active]="isLast && !breadcrumb.link">
							<espd-message [config]="breadcrumb.message" />
						</espd-breadcrumb>
					}
				</espd-breadcrumb-list>
			}
		</espd-admin-header>
	}
</ng-template>

<ng-content select="[topContent]" />

<div class="row justify-content-between align-items-center my-3">
	<espd-message class="sr-only" id="listPageSearch" [config]="searchLabel" />
	@if (disableSearch) {
		<div class="col-12 col-lg-6"></div>
	} @else {
		<div [formGroup]="form" class="col-12 col-lg-6">
			<espd-search #search espdControlName="search" [placeholder]="searchPlaceholder" labelledby="listPageSearch" (search)="doSearch($any($event))" />
		</div>
	}
	<div class="col-auto button-group mt-2 mt-lg-0">
		<ng-content select="[buttons]" />
	</div>
</div>
@if (!disableFilter) {
	<espd-entity-list-filters>
		<ng-content form select="[filterForm]" />
		<ng-content values select="[filterValues]" />
	</espd-entity-list-filters>
}

@if (showLoadingIndicator) {
	<espd-loading-placeholder />
}

@if (showData && page && page.totalElements === 0) {
	<espd-empty-list>
		<ng-content select="[emptyListAction]" />
	</espd-empty-list>
}

<!-- TODO: assign "loading" variable to the pagination disabled attribute when implemented in ESPD-Common -->
@if (showData) {
	<espd-table #table
		[page]="page"
		(pageChanged)="doPageChange($event)"
		[columns]="columns"
		[actionsGenerator]="actionGenerator"
		[sectionConfig]="sectionConfig" />
}

<espd-single-step-modal #deleteModal />
