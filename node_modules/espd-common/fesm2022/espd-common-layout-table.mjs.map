@if (isActionList) {
<espd-dropdown rounded secondary placement="right">
	<espd-dropdown-label class="sr-only">
		<espd-message key="common.table.actions.sr" [args]="[actionListLabel]" />
	</espd-dropdown-label>
	@for (action of actionList.actions; track $index) {
		@if (isSeparator(action)) {
		<div class="dropdown-divider"></div>
		} @else {
		<espd-dropdown-item [routerPath]="action.route"
				[disabled]="action.disabled" (click)="action.action?.()">
			<espd-message [config]="action.label" />
		</espd-dropdown-item>
		}
	}
</espd-dropdown>
} @else if (isSingleAction) {
<espd-button [secondary]="true"
		[rounded]="singleAction.hideLabel || false"
		[routerPath]="singleAction.route"
		(click)="singleAction.performAction()">
	@if (singleAction.hideLabel) {
	<i [espdIcon]="singleAction.icon ? singleAction.icon : 'rvt-arrow-right'"></i>
	}
	<espd-message [config]="singleAction.label" [class.sr-only]="singleAction.hideLabel" />
</espd-button>
}
