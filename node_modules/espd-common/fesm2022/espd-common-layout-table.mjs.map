@if (column) {
	@if (column.contentTemplate) {
		<ng-container *ngTemplateOutlet="column.contentTemplate; context: {rowItem : item}" />
	} @else if (column.textExtractor) {
		{{extractValue(column.textExtractor)}}
		@if (column.subtextExtractor) {
			<div>
				{{extractValue(column.subtextExtractor)}}
			</div>
		}
	}
}
