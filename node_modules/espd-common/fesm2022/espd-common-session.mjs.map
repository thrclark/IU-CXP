<p>
	<espd-message
		[key]="sessionService.canLogOut()
			? 'common.sessionDialog.body'
			: 'common.sessionDialog.body.refreshOnly'"
		[args]="[sessionService.sessionDurationMinutes().toFixed(0)]" />
</p>
<div class="text-center mb-4">
	<span class="d-inline-block ts-36 font-weight-lighter border rounded-pill pr-3 pl-3">
		{{ sessionService.secondsToExpiration() * 1000 | date:'m:ss' }}
	</span>
</div>
