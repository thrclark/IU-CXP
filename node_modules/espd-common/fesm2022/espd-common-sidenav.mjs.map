<div class="wrapper">
	<espd-sidenav-item
			#navItem
			[route]="route"
			[queryParams]="queryParams"
			[href]="href"
			[linkActiveOptions]="linkActiveOptions"
			[clickable]="isClickable()"
			(click)="isClickable() && isCollapsed = !isCollapsed"
			[class.current]="navItem.isActive"
			class="border-0">
		<espd-message [config]="label" />
		<ng-content select="[labelContent]" />
	</espd-sidenav-item>
	<button type="button"
			[attr.aria-expanded]="isCollapsed ? 'false' : 'true'"
			[attr.aria-controls]="'sidenav-dropdown-' + id"
			(click)="isCollapsed = !isCollapsed">
		<espd-message class="sr-only" key="common.sidenav.toggle.sr" [args]="[resolvedSrLabel]" />
		<svg fill="currentColor" width="16" height="16" viewBox="0 0 16 16">
			<path d="m15.146 6.263-1.292-1.526L8 9.69 2.146 4.737.854 6.263 8 12.31l7.146-6.047Z" />
		</svg>
	</button>
</div>
<div id="sidenav-dropdown-{{id}}" [collapse]="isCollapsed" [isAnimated]="true">
	<!-- wrap ul in div so animation includes margin/padding on the ul and isn't jumpy -->
	<ul>
		<ng-content />
	</ul>
</div>
