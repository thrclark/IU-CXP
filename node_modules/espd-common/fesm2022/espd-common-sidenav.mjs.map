@if (route) {
	<a [routerLink]="route"
			[queryParams]="queryParams"
			routerLinkActive
			[routerLinkActiveOptions]="isActiveMatchOptions"
			#rla="routerLinkActive"
			ariaCurrentWhenActive="page">
		<ng-container *ngTemplateOutlet="content" />
	</a>
} @else {
	@if (href) {
		<a [href]="href" [attr.target]="target ? '_'+target : null">
			<ng-container *ngTemplateOutlet="content" />
		</a>
	} @else {
		@if (clickable) {
			<button type="button" class="btn btn-link link text-left font-weight-normal">
				<ng-container *ngTemplateOutlet="content" />
			</button>
		} @else {
			<span class="link">
				<ng-container *ngTemplateOutlet="content" />
			</span>
		}
	}
}

<ng-template #content>
	<ng-content />
</ng-template>
