<section class="nav nav-pills" [class.nav-fill]="justified" role="tablist" (keyup)="onKey($event)">
	@for (tab of tabs; track $index) {
		<div class="nav-item">
			<button type="button" class="btn nav-link" role="tab" #tabButton
					[attr.aria-controls]="tab.id"
					[attr.aria-selected]="tab.active"
					[attr.id]="tab.id ? tab.id + '-link' : ''"
					[class.active]="tab.active"
					[tabindex]="tab.active ? 0 : -1"
					(click)="selectTab(tab)">
				<espd-message [config]="tab.heading" />
			</button>
		</div>
	}
</section>

<ng-content />
