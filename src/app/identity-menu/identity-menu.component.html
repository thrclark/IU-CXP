<div class="identity-menu">
  <button type="button"
      class="identity-btn"
      aria-haspopup="true"
      [attr.aria-expanded]="open"
      [attr.aria-label]="'Account menu -- viewing as ' + persona.current.displayName + ', ' + persona.current.label"
      (click)="toggle($event)">
    <span class="identity-avatar">
      <span class="identity-initials">{{ persona.current.initials }}</span>
    </span>
    <span class="identity-name d-none d-xl-inline">{{ persona.current.displayName }}</span>
  </button>

  @if (open) {
    <div class="dropdown-menu dropdown-menu-right identity-panel py-0 show" role="menu">
      <div class="dropdown-header identity-panel-header">
        <div class="identity-panel-name">{{ persona.current.displayName }}</div>
        <div class="identity-panel-role">Viewing as: {{ persona.current.label }}</div>
      </div>

      <div class="identity-panel-section">
        <div class="identity-panel-section-title">View prototype as</div>
        <ul class="identity-persona-list" role="none">
          @for (option of persona.personas; track option.id) {
            <li role="none">
              <button type="button"
                  role="menuitemradio"
                  [attr.aria-checked]="option.id === persona.current.id"
                  class="identity-persona-option"
                  [class.identity-persona-option--active]="option.id === persona.current.id"
                  (click)="choose(option.id)">
                <span class="identity-persona-initials" aria-hidden="true">{{ option.initials }}</span>
                <span class="identity-persona-copy">
                  <span class="identity-persona-label">{{ option.label }}</span>
                  <span class="identity-persona-desc">{{ option.description }}</span>
                </span>
                <span class="identity-persona-check" aria-hidden="true">&#10003;</span>
              </button>
            </li>
          }
        </ul>
      </div>

      <div class="identity-panel-footer">
        Prototype tool -- this only changes what you see, in this browser.
      </div>
    </div>
  }
</div>
