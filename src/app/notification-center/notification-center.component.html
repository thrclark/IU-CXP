<espd-header [fullWidth]="true" subtitle="Indiana University" [user]="{username:'thrclark', initials:'TC'}">
  <div mobile-menu>
    <espd-header-nav label="Navigation">
      <espd-header-nav-item route="/dashboard"><i [espdIcon]="'rvt-grid'"></i> <span class="nav-item-label">Dashboard</span></espd-header-nav-item>
      <espd-header-nav-item route="/announcements"><i [espdIcon]="'rvt-megaphone'"></i> <span class="nav-item-label">Announcements</span></espd-header-nav-item>
      <espd-header-nav-item route="/events-calendars"><i [espdIcon]="'rvt-calendar'"></i> <span class="nav-item-label">Events & Calendars</span></espd-header-nav-item>
      <espd-header-nav-item route="/directory"><i [espdIcon]="'address-book'"></i> <span class="nav-item-label">Directory</span></espd-header-nav-item>
      <espd-header-nav-item route="/maps"><i [espdIcon]="'rvt-map-pin'"></i> <span class="nav-item-label">Maps</span></espd-header-nav-item>
    </espd-header-nav>
  </div>
</espd-header>

<espd-shell [collapsible]="false">
  <espd-shell-sidebar>
    <espd-sidenav label="Navigation">
      <espd-sidenav-item route="/dashboard"><i [espdIcon]="'rvt-grid'"></i> <span class="nav-item-label">Dashboard</span></espd-sidenav-item>
      <espd-sidenav-item route="/announcements"><i [espdIcon]="'rvt-megaphone'"></i> <span class="nav-item-label">Announcements</span></espd-sidenav-item>
      <espd-sidenav-item route="/events-calendars"><i [espdIcon]="'rvt-calendar'"></i> <span class="nav-item-label">Events & Calendars</span></espd-sidenav-item>
      <espd-sidenav-item route="/directory"><i [espdIcon]="'address-book'"></i> <span class="nav-item-label">Directory</span></espd-sidenav-item>
      <espd-sidenav-item route="/maps"><i [espdIcon]="'rvt-map-pin'"></i> <span class="nav-item-label">Maps</span></espd-sidenav-item>
    </espd-sidenav>
  </espd-shell-sidebar>

  <espd-shell-stage>
    <a routerLink="/" class="back-link"><i [espdIcon]="'rvt-arrow-left'"></i> Back to dashboard</a>

    <h1 class="notification-center-title">Notifications</h1>

    <div class="section-border"></div>

    <div class="notification-list">
      @for (notification of notifications; track notification.title) {
        <app-card>
          <div class="notification-list-row">
            <i [espdIcon]="notification.icon" class="notification-row-icon"></i>
            <div class="notification-row-body">
              <div class="notification-row-title">{{ notification.title }}</div>
              <div class="notification-row-time">{{ notification.time }}</div>
            </div>
          </div>
        </app-card>
      }
    </div>
  </espd-shell-stage>
</espd-shell>

<espd-footer [customFooterOverride]="footerHtml" />
